# @package _global_
# SAC defaults for stable-baselines3 on ManiSkill.
algo: sac
env_id: PickCube-v1
total_timesteps: 1_000_000
n_envs: 1  # SAC is off-policy, single env is standard

learning_rate: 3.0e-4
buffer_size: 1_000_000
learning_starts: 10_000
batch_size: 256
tau: 0.005
gamma: 0.99
train_freq: 1
gradient_steps: 1
ent_coef: auto
target_update_interval: 1

policy: MlpPolicy
policy_kwargs:
  net_arch: [256, 256]

checkpoint_dir: /workspace/.sb3_checkpoints/${algo}
wandb: null
